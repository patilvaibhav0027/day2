<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <style>

    .cart-button
        {
        background-color:rgb(255,216,20);
        border-color:black;
        border-style:solid;
        border-width:0px;
        color:rgb(black);
        border-radius:  50px;
        cursor:pointer;
        margin-right: 8px; 
        transition: background-color,
            color, 1.1s;
        padding-bottom: 5px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 5px;
        }

    .cart-button:hover
        {
            background-color:black;
            color:rgb(255,216,20);
            opacity:0.9;
        }
    </style>
</head>
<body>
    <button class="cart-button">
        Add to Cart
    </button>
</body>
</html>
