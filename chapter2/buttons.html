<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .subscriber-button
    {
        background-color:red;
        color:rgb(255,255,255);
        border:none;
        height: 36px;
        width: 105px;
        border: radius 2px;
        cursor:2px;
        margin: right 8px;
    }

    .join-button
    {
        background-color:white;
        border-color:rgb(41,56,78);
        border-style:solid;
        border-width:1px;
        color:rgb(red, green, rgb(81, 81, 209))
        height: 36px;
        width: 105px;
        border radius:  2px;
        cursor:pointer;
        margin-right: 8px;
    }


    .tweet-button
    {
        background-color:blue;
        color:rgb(255,255,255);
        border:none;
        height: 36px;
        width: 74px;
        border radius: 18px;
        font-weight:bold;
        font-size:15px;
        cursor:pointer;
        margin: right 8px;
    }
</style>
</head>
<body>
    <button class="subscriber-button"> SUBSCRIBE </button>
<button class="join-button"> JOIN</button>
<button class="tweet-button"> TWEET</button>
</body>
</html>
