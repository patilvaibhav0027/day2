<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .add-button
        {
            background-color: rgb(255,216,20);
            height: 36px;
            width: 120px;
            border-width: 1px;
            border-color:rgb(255,216,20);
            border-radius: 50px;
            color: black;
            margin: right 8px;
            cursor: pointer;
        }

        .add-button:active
        {
            opacity: 0.6;
        }

        .buy-button
        {
            background-color: rgb(255,164,28);
            height: 36px;
            width: 100px;
            border-width: 1px;
            border-radius: 50px;
            color: black;
            margin: right 8px;
            cursor:pointer;

        }
        .buy-button:active
        {
            opacity: 0.6;
        }

        a
        {
            color:rgb(0,113,133);
        }
        a:active
        {
            color:rgb(227, 14, 14);
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.in/" > Back to amazon</a>

    <h1>
    Nike Black Running Shoes
    </h1>
    <p style="color:rgb(0,118,0); font-size:18px; font-weight:bold;">
        <br> $39 - in stocks.
    </p>
    <h5> 
        Free delivery tomorrow.
    </h5>
    <button class="add-button"> Add to Cart </button>
    <button class="buy-button"> Buy Now</button>

</body>
</html>
