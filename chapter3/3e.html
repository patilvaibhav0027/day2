<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinedIn</title>
    <style>
        .apply-button
        {
            background-color: rgb(10,102,194);
            height: 36px;
            width: 200px;
            border-width: 1px;
            border-color: rgb(10,102,194) ;
            border-radius: 50px;
            color: white;
            margin: right 8px;
            transition: background-color 1s;

        }
        .apply-button:hover
        {
            background-color:rgb(36, 36, 170);
        }

        .save-button
        {
            background-color: white;
            height: 36px;
            width: 90px;
            border-width: 2px;
            border-color: rgb(10,102,194);
            border-radius: 50px;
            color: rgb(10,102,194);
            margin: right 8px;
            transition: opacity background-color ;
        }

        .save-button:hover
        {
            background-color:rgb(166, 239, 239);
            color:rgb(36, 36, 170);
            border-color: rgb(36, 36, 170);
        }
    </style>
</head>
<body>
    <button class="apply-button " style="font-weight: bold;">Apply on Company website</button>
    <button class="save-button" style="font-weight: bold";>Save</button>
</body>
</html>
