<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP</title>
    <style>
        .start-button
        {
            background-color: rgb(121,82,179);
            height: 36px;
            width: 105px;
            border-width: 1px;
            border-color: black ;
            border-radius: 4px;
            color:white;
            margin: right 8px;
            cursor: pointer;
            transition:background-color, 1s;
        }
        .start-button:hover
        {
            background-color: rgb(100, 68, 147);

        }

        .download-button
        {
            background-color: rgb(249, 252, 252);
            height: 36px;
            width: 105px;
            border-width: 1px;
            border-color: black ;
            border-radius: 4px;
            color: rgb(108,117,125);
            margin: right 8px;
            transition: background-color, color, 1s;

        }
        .download-button:hover
        {
            background-color:rgb(108,117,125);
            color: rgb(249, 252, 252);

        }
    </style>
</head>
<body>
    <button class="start-button">Get started</button>
    <button class="download-button">Download</button>
</body>
</html>
